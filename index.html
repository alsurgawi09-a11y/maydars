<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Dars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#16302f;--muted:#5b706e;--pine:#0f3d3e;--brass:#b8893b;--line:#d9e2de;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1716;--surface:#142726;--ink:#e6efec;--muted:#93aaa6;--pine:#7fc4bb;--brass:#d7aa5c;--line:#244240}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Source Sans 3",system-ui,sans-serif}
.in{max-width:1000px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .in{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 24px Amiri,Georgia,serif}
.logo{width:28px;height:28px;color:var(--brass)}
.hero{position:relative;overflow:hidden;color:#f3ead6;background:radial-gradient(120% 140% at 85% 0%,#14605d 0%,#0c3233 55%,#08201f 100%);padding:64px 0 48px}
.star{position:absolute;right:-70px;top:-60px;width:320px;height:320px;color:#e6bf73;opacity:.16;animation:spin 100s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{margin:0 0 6px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#e6bf73;font-weight:600}
h1{position:relative;font:700 clamp(56px,14vw,104px)/1.05 Amiri,Georgia,serif;margin:0}
h1 .w{display:inline-block;margin-right:.22em}
h1 .l{display:inline-block;color:transparent;-webkit-text-fill-color:transparent;background:linear-gradient(100deg,#f7f0de 35%,#e6bf73 50%,#f7f0de 65%) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;opacity:0;transform:translateY(.45em);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards,shine 7s ease-in-out infinite;animation-delay:calc(var(--i)*90ms),calc(1.6s + var(--i)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes shine{0%{background-position:100% 0}55%,100%{background-position:0 0}}
.ar{font:400 36px/1.4 Amiri,serif;color:#e6bf73;margin:4px 0 0;opacity:0;animation:fade 1s ease 1s forwards}
@keyframes fade{to{opacity:1}}
.quote{font:400 23px/1.5 Amiri,Georgia,serif;color:rgba(243,234,214,.85);margin:14px 0 0;max-width:38ch;min-height:3.1em;transition:opacity .5s}
.quote.out{opacity:0}
.stats{display:inline-block;margin:6px 0 0;padding:5px 14px;border:1px solid rgba(230,191,115,.5);border-radius:999px;font-size:14px;color:#f3ead6}
@media (prefers-reduced-motion:reduce){h1 .l{animation:none;opacity:1;transform:none}.ar{animation:none;opacity:1}.star{animation:none}.card{transition:none}}
.ads{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:28px 0 0;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ads::-webkit-scrollbar{display:none}
.adw{flex:none;position:relative;scroll-snap-align:start;width:min(420px,86%)}
.ad{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:150px;text-decoration:none;color:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 4px 14px rgba(10,40,40,.15)}
.ad b{font:700 24px/1.25 Amiri,Georgia,serif}
.ad small{font-size:13px;opacity:.85}
.ad.off{pointer-events:none}
.adx{position:absolute;top:8px;right:8px;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font:600 13px "Source Sans 3",sans-serif;padding:3px 10px;cursor:pointer}
.dots{display:flex;justify-content:center;margin:4px 0 0}
.dot{width:8px;height:8px;border-radius:50%;border:0;background:var(--line);padding:0;margin:7px 5px;cursor:pointer;transition:width .25s,background .25s}
.dot[aria-current="true"]{background:var(--brass);width:22px;border-radius:99px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0 4px}
.tabs{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.tabs button{border:0;background:none;color:var(--muted);font:600 16px "Source Sans 3",sans-serif;padding:8px 22px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--pine);color:var(--bg)}
input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;width:100%}
#q{flex:1;min-width:160px;width:auto;border-radius:999px;padding:10px 18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{border:1.5px solid var(--pine);background:var(--pine);color:var(--bg);border-radius:999px;padding:9px 20px;font:600 16px "Source Sans 3",sans-serif;cursor:pointer}
.btn.ghost{background:none;color:var(--pine)}
.btn.sm{padding:6px 16px;font-size:15px}
.adm{margin:8px 0 0}
.adm .btn{margin:0 6px 6px 0}
#admnote{color:var(--brass);font-size:15px;margin:4px 0 8px}
#form,#qform{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:16px;margin-top:10px}
#form label,#qform label{font-weight:600;font-size:15px;display:grid;gap:4px}
#form small,#qform small{font-weight:400;color:var(--muted)}
textarea{min-height:150px;resize:vertical}
#pv{max-width:120px;border-radius:6px}
#msg{color:var(--muted);font-size:15px;margin:6px 0 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:16px 0 48px}
.grid.kitab{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(10,40,40,.16)}
.po{position:relative;display:grid;place-items:center;color:#fff;font:700 46px Amiri,serif;overflow:hidden}
.po.video{aspect-ratio:16/9}
.po.kitab{aspect-ratio:3/4}
.po img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.93);color:#0c3233;display:grid;place-items:center;font-size:13px;padding-left:2px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.t{font:700 20px/1.3 Amiri,Georgia,serif;margin:0}
.m{color:var(--muted);font-size:15px;margin:0}
.go{margin-top:auto;text-align:center;text-decoration:none;font:600 15px "Source Sans 3",sans-serif;border:1.5px solid var(--pine);color:var(--pine);border-radius:999px;padding:7px 14px;background:none}
a.go:hover{background:var(--pine);color:var(--bg)}
.go.off{border-color:var(--line);color:var(--muted);pointer-events:none}
.del{border-color:var(--line);color:var(--muted);cursor:pointer;margin-top:0;font-size:14px;padding:4px 12px}
.empty{grid-column:1/-1;padding:28px 4px;color:var(--muted)}
.foot{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:15px;text-align:center}

#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;color:#f3ead6;background:radial-gradient(120% 140% at 50% 0%,#14605d 0%,#0c3233 55%,#08201f 100%);animation:introOut .85s cubic-bezier(.7,0,.2,1) 2.6s forwards;cursor:pointer}
.isr{position:absolute;width:min(92vw,580px);color:#e6bf73;opacity:0;animation:isIn 1.4s ease .1s forwards,spin 40s linear infinite}
.isr rect,.isr circle{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2s ease .2s forwards}
.imid{position:relative;text-align:center}
.iname{display:block;font:700 clamp(54px,15vw,96px)/1.05 Amiri,Georgia,serif;letter-spacing:.02em;opacity:0;transform:translateY(.4em);animation:rise .9s cubic-bezier(.2,.8,.2,1) .7s forwards}
.iar{display:block;font:400 36px/1.4 Amiri,serif;color:#e6bf73;opacity:0;animation:fade .9s ease 1.2s forwards}
.iline{display:block;height:2px;width:0;margin:14px auto 0;background:#e6bf73;animation:grow 1s ease 1.4s forwards}
.iskip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;letter-spacing:.08em;opacity:0;animation:isHint 1s ease 1.6s forwards}
@keyframes isIn{to{opacity:.26}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{width:140px}}
@keyframes isHint{to{opacity:.6}}
@keyframes introOut{to{transform:translateY(-100%);visibility:hidden}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
body.introing{overflow:hidden}
body.hold h1 .l,body.hold .ar,body.hold .grid.enter .card{animation-play-state:paused}
.grid.enter .card{animation:up .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*70ms)}
@media (prefers-reduced-motion:reduce){#intro{display:none}.grid.enter .card{animation:none}}

.grid.groups{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.gcard{border:0;color:#f3ead6;text-align:left;cursor:pointer;aspect-ratio:16/9;padding:18px 20px;justify-content:flex-end;gap:6px;position:relative;font:inherit}
.gcard .gt{font:700 clamp(26px,7vw,34px)/1.1 Amiri,Georgia,serif}
.gcard .gc{font-size:15px;color:#e6bf73;letter-spacing:.04em}
.gcard .go2{position:absolute;top:12px;right:14px;background:rgba(8,32,31,.6);font-weight:600;font-size:15px;border:1.5px solid rgba(243,234,214,.6);border-radius:999px;padding:4px 14px}
.gcard:hover .go2{background:#f3ead6;color:#0c3233}
.ghead{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:4px 0 6px}
.ghead h2{margin:0;font:700 clamp(36px,9vw,56px)/1.1 Amiri,Georgia,serif;color:var(--pine)}
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><svg class="isr" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width=".5"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="12"/></g></svg><div class="imid"><span class="iname">My Dars</span><span class="iar" lang="ar" dir="rtl">دروسي</span><span class="iline"></span></div><small class="iskip">Ketuk untuk melewati</small></div>
<nav class="nav"><div class="in"><a class="brand" href="./"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="12"/></g></svg><span>My Dars</span></a><button class="btn ghost sm" id="tg" hidden="">Masuk mode admin</button></div></nav>
<header class="hero">
<svg class="star" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="18" y="18" width="64" height="64"/><rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="12"/></g></svg>
<div class="in">
<p class="eyebrow">Majelis ilmu digital</p>
<h1 aria-label="My Dars"><span class="w" aria-hidden="true"><span class="l" style="--i:0">M</span><span class="l" style="--i:1">y</span></span><span class="w" aria-hidden="true"><span class="l" style="--i:2">D</span><span class="l" style="--i:3">a</span><span class="l" style="--i:4">r</span><span class="l" style="--i:5">s</span></span></h1>
<p class="ar" lang="ar" dir="rtl">دروسي</p>
<p class="quote" id="quote" aria-live="polite"></p>
<p class="stats" id="stats"></p>
</div>
</header>
<main class="in">
<div class="ads" id="ads" role="region" aria-label="Iklan, geser ke samping" tabindex="0"></div>
<div class="dots" id="dots"></div>
<div class="bar">
<div class="tabs" role="tablist">
<button role="tab" id="tab-video" aria-selected="true">Video</button>
<button role="tab" id="tab-kitab" aria-selected="false">Kitab PDF</button>
</div>
<input id="q" type="search" placeholder="Cari judul…" aria-label="Cari judul">
</div>
<div class="adm">
<p id="admnote" hidden="">Mode admin aktif. Setelah selesai mengubah, tekan Unduh versi baru lalu unggah file index.html itu ke hosting-mu.</p>
<button class="btn" id="dl" hidden="">Unduh versi baru</button>
<button class="btn" id="add" hidden="">+ Tambah video / kitab / iklan</button>
<button class="btn ghost" id="qedit" hidden="">Ubah kata motivasi</button>
<form id="form" hidden="">
<label>Jenis
<select id="f-kind"><option value="video">Video</option><option value="kitab">Kitab PDF</option><option value="ads">Iklan</option></select></label>
<label>Kitab / seri <small>(untuk video, misal Risalatul Jami'ah)</small><input id="f-group"></label>
<label>Judul <input id="f-title" required=""></label>
<label>Keterangan <small>(opsional, misal nama ustadz atau durasi)</small><input id="f-note"></label>
<label>Link <small>(link video YouTube, link file PDF, atau tujuan iklan)</small><input id="f-url" type="text" inputmode="url" placeholder="https://" autocapitalize="off" autocorrect="off"></label>
<label>Poster <small>(opsional, gambar dari galeri)</small><input id="poster" type="file" accept="image/*"></label>
<img id="pv" alt="Pratinjau poster" hidden="">
<div><button class="btn" type="submit">Simpan</button> <button class="btn ghost" type="button" id="cancel">Batal</button></div>
</form>
<form id="qform" hidden="">
<label>Kata motivasi <small>(satu kalimat per baris, nanti tampil bergantian di bawah judul)</small><textarea id="qtext"></textarea></label>
<div><button class="btn" type="submit">Simpan</button> <button class="btn ghost" type="button" id="qcancel">Batal</button></div>
</form>
<p id="msg" role="status"></p>
</div>
<div id="list" class="grid video"></div>
</main>
<footer class="foot"><div class="in">© My Dars · Belajar tanpa henti</div></footer>

<script>
const $=id=>document.getElementById(id);
const INTRO=$("intro")?$("intro").outerHTML:"";
const state=JSON.parse($("data").textContent);
let tab="video",canEdit=false,poster="",askDel=null,cur=0,grp=null;
const isAdmin=/[?&]admin(&|=|$)/.test(location.search);
if(isAdmin){try{const d=localStorage.getItem("mydars-draft");if(d)Object.assign(state,JSON.parse(d))}catch(e){}}

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function msg(t){$("msg").textContent=t}

/* Iklan + titik penanda */
function goAd(k){const el=$("ads"),t=el.children[k];if(!t)return;el.scrollTo({left:t.getBoundingClientRect().left-el.getBoundingClientRect().left+el.scrollLeft,behavior:"smooth"})}
function mark(){
 const el=$("ads"),kids=[...el.children];if(!kids.length)return;
 const L=el.getBoundingClientRect().left;let best=0,bd=1e9;
 kids.forEach((k,j)=>{const d=Math.abs(k.getBoundingClientRect().left-L);if(d<bd){bd=d;best=j}});
 if(el.scrollLeft+el.clientWidth>=el.scrollWidth-2)best=kids.length-1;
 cur=best;
 [...$("dots").children].forEach((d,j)=>d.setAttribute("aria-current",String(j===best)));
}
function renderAds(){
 const el=$("ads"),dots=$("dots");el.replaceChildren();dots.replaceChildren();
 state.ads.forEach((i,k)=>{
  const a=document.createElement("a");a.className="ad"+(i.url?"":" off");a.style.background=i.poster?'linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url("'+i.poster+'") center/cover':i.bg;
  if(i.url){a.href=i.url;a.target="_blank";a.rel="noopener noreferrer sponsored"}
  const b=document.createElement("b");b.textContent=i.title;
  const s=document.createElement("small");s.textContent=i.note;
  a.append(b,s);const w=document.createElement("div");w.className="adw";w.append(a);
  if(canEdit){const x=document.createElement("button");x.className="adx";x.textContent=askDel==="ad"+k?"Yakin hapus?":"Hapus";x.onclick=()=>{if(askDel==="ad"+k){state.ads.splice(k,1);askDel=null;renderAds();save()}else{askDel="ad"+k;renderAds()}};w.append(x)}
  el.append(w);
  const d=document.createElement("button");d.className="dot";d.setAttribute("aria-label","Iklan "+(k+1));
  d.onclick=()=>goAd(k);
  dots.append(d);
 });
 el.onscroll=mark;mark();
}

/* Daftar video / kitab */
function ytId(u){const m=/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/.exec(u||"");return m?m[1]:""}
function thumb(i){return i.poster||(ytId(i.url)?"https://i.ytimg.com/vi/"+ytId(i.url)+"/hqdefault.jpg":"")}
function poEl(i,kind){
 const d=document.createElement("div");d.className="po "+kind;
 const g=i.group||i.title;
 d.style.background="linear-gradient(135deg,hsl("+hue(g)+" 38% 30%),hsl("+((hue(g)+40)%360)+" 40% 20%))";
 d.textContent=i.badge||[...i.title.replace(/^Contoh:\s*/,"")][0]||"•";
 const src=kind==="video"?thumb(i):i.poster;
 if(src){const im=document.createElement("img");im.alt="";im.loading="lazy";im.referrerPolicy="no-referrer";im.onerror=()=>im.remove();im.src=src;d.append(im)}
 return d;
}
function groups(){const m=new Map();state.video.forEach(i=>{const g=i.group||"Lainnya",o=m.get(g)||{cnt:0,src:""};o.cnt++;if(!o.src)o.src=thumb(i);m.set(g,o)});return [...m]}
function render(){
 const list=$("list"),f=$("q").value.trim().toLowerCase();list.replaceChildren();
 $("stats").textContent=state.video.length+" video · "+state.kitab.length+" kitab";
 const asGroups=tab==="video"&&grp===null&&!f;
 list.className="grid "+(asGroups?"groups":tab);
 const empty=t=>{const p=document.createElement("p");p.className="empty";p.textContent=t;list.append(p)};
 if(asGroups){
  const G=groups();if(!G.length){empty("Belum ada isi.");return}
  G.forEach(([g,info],n)=>{
   const b=document.createElement("button");b.className="card gcard";b.style.setProperty("--n",n);
   const col="linear-gradient(135deg,hsl("+hue(g)+" 38% 30%),hsl("+((hue(g)+40)%360)+" 40% 18%))";
   b.style.background=info.src?'linear-gradient(180deg,rgba(8,32,31,0) 38%,rgba(8,32,31,.92) 100%),url("'+info.src+'") center/cover,'+col:col;
   const t=document.createElement("span");t.className="gt";t.textContent=g;
   const c=document.createElement("span");c.className="gc";c.textContent=info.cnt+" video";
   const o=document.createElement("span");o.className="go2";o.textContent="Buka ›";
   b.append(t,c,o);
   b.onclick=()=>{grp=g;render();window.scrollTo({top:Math.max(0,$("list").getBoundingClientRect().top+window.scrollY-80),behavior:"smooth"})};
   list.append(b);
  });
  return;
 }
 const rows=state[tab].map((i,idx)=>({i,idx})).filter(r=>r.i.title.toLowerCase().includes(f)&&(tab!=="video"||grp===null||(r.i.group||"Lainnya")===grp));
 if(tab==="video"&&grp!==null){
  const h=document.createElement("div");h.className="ghead";
  const back=document.createElement("button");back.className="btn ghost sm";back.textContent="‹ Semua kitab";
  back.onclick=()=>{grp=null;$("q").value="";render()};
  const h2=document.createElement("h2");h2.textContent=grp;
  const cn=document.createElement("p");cn.className="m";cn.textContent=rows.length+" video";
  h.append(back,h2,cn);list.append(h);
 }
 if(!rows.length){empty(f?"Tidak ada hasil untuk pencarian itu.":"Belum ada isi.");return}
 rows.forEach(({i,idx},n)=>{
  const c=document.createElement("article");c.className="card";c.style.setProperty("--n",n);
  const po=poEl(i,tab);
  if(tab==="video"){const p=document.createElement("span");p.className="play";p.setAttribute("aria-hidden","true");p.textContent="▶";po.append(p)}
  const cb=document.createElement("div");cb.className="cb";
  const t=document.createElement("p");t.className="t";t.textContent=i.title;
  const m=document.createElement("p");m.className="m";m.textContent=i.note||"";
  const a=document.createElement("a");a.className="go"+(i.url?"":" off");
  a.textContent=i.url?(tab==="video"?"Tonton video":"Unduh PDF"):"Link belum diisi";
  if(i.url){a.href=i.url;a.target="_blank";a.rel="noopener noreferrer";if(tab==="kitab")a.setAttribute("download","")}
  cb.append(t);if(i.note)cb.append(m);cb.append(a);
  if(canEdit){
   const x=document.createElement("button");x.className="go del";
   const key=tab+idx;x.textContent=askDel===key?"Yakin hapus?":"Hapus";
   x.onclick=()=>{if(askDel===key){state[tab].splice(idx,1);askDel=null;render();save()}else{askDel=key;render()}};
   cb.append(x);
  }
  c.append(po,cb);list.append(c);
 });
}
function setTab(t){tab=t;grp=null;askDel=null;$("tab-video").setAttribute("aria-selected",String(t==="video"));$("tab-kitab").setAttribute("aria-selected",String(t==="kitab"));render()}
$("tab-video").onclick=()=>setTab("video");
$("tab-kitab").onclick=()=>setTab("kitab");
$("q").oninput=render;

/* Simpan: draf di browser, lalu unduh index.html baru untuk diunggah ke hosting */
function snapshot(){
 const c=document.documentElement.cloneNode(true);c.removeAttribute("data-theme");c.removeAttribute("style");
 c.querySelector("#data").textContent=JSON.stringify(state).replace(/</g,"\\u003c");
 ["list","ads","dots","stats"].forEach(id=>c.querySelector("#"+id).replaceChildren());
 c.querySelector("#list").className="grid video";
 c.querySelector("#msg").textContent="";
 ["form","add","qform","qedit","tg","admnote","dl"].forEach(id=>{const e=c.querySelector("#"+id);if(e)e.hidden=true});
 c.querySelector("#tg").textContent="Masuk mode admin";
 c.querySelector("#quote").textContent="";c.querySelector("#quote").className="quote";
 const pv=c.querySelector("#pv");pv.hidden=true;pv.removeAttribute("src");
 c.querySelector("#tab-video").setAttribute("aria-selected","true");
 c.querySelector("#tab-kitab").setAttribute("aria-selected","false");
 const bd=c.querySelector("body");bd.className="";if(!c.querySelector("#intro"))bd.insertAdjacentHTML("afterbegin",INTRO);
 return "<!DOCTYPE html>\n"+c.outerHTML;
}
function save(){
 try{localStorage.setItem("mydars-draft",JSON.stringify(state))}catch(e){}
 $("dl").hidden=false;
 msg("Perubahan tersimpan sementara di browser ini. Tekan Unduh versi baru, lalu unggah file index.html itu ke hosting supaya dilihat semua orang.");
}
$("dl").onclick=()=>{
 const b=new Blob([snapshot()],{type:"text/html"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="index.html";document.body.append(a);a.click();a.remove();
 try{localStorage.removeItem("mydars-draft")}catch(e){}
};

/* Form tambah */
$("add").onclick=()=>{$("f-kind").value=tab;$("form").hidden=false;$("add").hidden=true;$("f-title").focus()};
$("cancel").onclick=()=>{$("form").reset();poster="";$("pv").hidden=true;$("form").hidden=true;$("add").hidden=false};
$("poster").onchange=e=>{
 const f=e.target.files[0];poster="";$("pv").hidden=true;if(!f)return;
 const img=new Image(),u=URL.createObjectURL(f);
 img.onload=()=>{
  const w=Math.min(360,img.width),h=Math.round(img.height*w/img.width),c=document.createElement("canvas");
  c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
  poster=c.toDataURL("image/jpeg",.8);URL.revokeObjectURL(u);$("pv").src=poster;$("pv").hidden=false;
 };
 img.src=u;
};
$("form").onsubmit=e=>{
 e.preventDefault();
 const title=$("f-title").value.trim();if(!title)return;
 let url=$("f-url").value.trim();if(url&&!/^https?:\/\//i.test(url))url="https://"+url;
 const kind=$("f-kind").value;
 const it={title,note:$("f-note").value.trim(),url,poster};
 if(kind==="video")it.group=$("f-group").value.trim();
 if(kind==="ads"){it.bg="hsl("+hue(title)+" 35% 28%)";state.ads.unshift(it);renderAds()}
 else{state[kind].unshift(it);setTab(kind)}
 save();
};

/* Kata motivasi berganti-ganti */
let qi=0;
function showQuote(first){
 const q=$("quote"),L=state.quotes||[];
 if(!L.length){q.textContent="";return}
 const next=()=>{q.textContent=L[qi%L.length];qi++;q.classList.remove("out")};
 if(first){next();return}
 q.classList.add("out");setTimeout(next,500);
}
setInterval(()=>showQuote(false),7000);
$("qedit").onclick=()=>{$("qtext").value=(state.quotes||[]).join("\n");$("qform").hidden=false;$("qedit").hidden=true;$("qtext").focus()};
$("qcancel").onclick=()=>{$("qform").hidden=true;$("qedit").hidden=false};
$("qform").onsubmit=e=>{e.preventDefault();state.quotes=$("qtext").value.split("\n").map(s=>s.trim()).filter(Boolean);qi=0;showQuote(true);$("qform").hidden=true;$("qedit").hidden=false;save()};

/* Mode admin: hanya muncul untuk pemilik / editor halaman */
$("tg").onclick=()=>{
 canEdit=!canEdit;askDel=null;
 $("tg").textContent=canEdit?"Keluar mode admin":"Masuk mode admin";
 $("add").hidden=!canEdit;$("qedit").hidden=!canEdit;$("admnote").hidden=!canEdit;
 if(!canEdit){$("form").hidden=true;$("qform").hidden=true}
 render();renderAds();
};

/* Iklan bergeser otomatis, berhenti saat disentuh */
let hold=false;const A=$("ads");
["mouseenter","touchstart","focusin"].forEach(ev=>A.addEventListener(ev,()=>{hold=true},{passive:true}));
["mouseleave","touchend","focusout"].forEach(ev=>A.addEventListener(ev,()=>setTimeout(()=>{hold=false},3000),{passive:true}));
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)setInterval(()=>{const n=A.children.length;if(hold||canEdit||n<2)return;goAd((cur+1)%n)},5000);

renderAds();render();showQuote(true);
$("list").classList.add("enter");setTimeout(()=>$("list").classList.remove("enter"),2600);

/* Animasi pembuka: tampil sekali per kunjungan, ketuk untuk melewati */
(function(){
 const el=$("intro");if(!el)return;
 let seen=null;try{seen=sessionStorage.getItem("mydars-intro")}catch(e){}
 if(seen||matchMedia("(prefers-reduced-motion:reduce)").matches){el.remove();return}
 try{sessionStorage.setItem("mydars-intro","1")}catch(e){}
 const b=document.body;b.classList.add("introing","hold");
 const go=()=>b.classList.remove("hold");
 const t=setTimeout(go,2500);
 const done=()=>{clearTimeout(t);go();el.remove();b.classList.remove("introing")};
 el.addEventListener("animationend",e=>{if(e.animationName==="introOut")done()});
 el.onclick=done;
})();
if(isAdmin)$("tg").hidden=false;
</script>
